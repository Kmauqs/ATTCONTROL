# 12 GB RAM host: a 8G heap + 4G metaspace leaves no native memory for
# the JVM C2 compiler or the Dart kernel snapshot.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows: Kotlin incremental caches often fail with
# "Could not close incremental caches" / "Storage is already registered".
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
