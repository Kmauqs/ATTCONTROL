name: attcontrol
description: ATTCONTROL — control de asistencia de personal.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.0
  go_router: ^15.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  geolocator: ^14.0.1
  local_auth: ^2.3.0
  mobile_scanner: ^7.0.0
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_dotenv: ^5.2.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/seed/
    - .env.example
    - assets/.env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon_1024.png
  adaptive_icon_background: "#1B5E3B"
  adaptive_icon_foreground: assets/branding/icon_1024.png
  remove_alpha_ios: true
